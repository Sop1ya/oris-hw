    <style>
    *{margin: 0; padding: 0;}
    body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    }
    .weather{
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: flex-end;
        font-weight: 700;
        margin-top: 35px;
        margin-right: 35px;
        font-family: Afacad;
        font-weight: 700;
    }
    .city{
        font-size: 20px;
        color: #6E6CDF;

    .temperature{
        display:flex;

        color: #212121;

        flex:1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 55.65px;

        display: flex;
        align-items: center;
        flex-direction: column;
        font-family: Afacad;
        font-weight: 700;
;

    .time{
        font-size: 74px;
        color: #212121;
    }
    .hello{
        font-size: 36px;
        color: #6E6CDF
    }

    .content_block{

        display: flex;
        flex-direction: column;
        align-items: center;
        width: 621.4492797851562;
        height: 185.7536163330078;
        gap: 55.65px;
    }

    .search {
        display: flex;
        box-sizing: border-box;
        align-items: center;
        width: 100%;
        max-width: 621.45px;
        height: 65.1px;
        padding: 18.55px 27.83px;
        gap: 9.28px;
        background-color: #FAFAFA;
        border: 1.16px solid #E5E5E5;
        border-radius: 18.55px;
    }

    .search_icon {
        position: relative;
        width: 28px;
        height: 28px;
        flex-shrink: 0;
    }

    .navigation{
        display:flex;
        align-items: center;
        justify-content: center;
        gap: 27.83px
    }

    .nav_item {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 65px;
        height: 65px;
        text-decoration: none;
    }

    .nav_item img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .search input {
        width: 100%;
        height: 100%;
        border: none;
        outline: none;
        background: transparent;
        font-family: Afacad;
        font-size: 14px;
    }

    </style>

</head>

<body>
    <header class="weather">   
        <div class="temperature">
            <p>36 </p>
            <svg width="10" height="10" xmlns="http://www.w3.org/2000/svg">
                <circle cx="5" cy="5" r="3" fill="transparent" stroke="black" stroke-width="2" />
            </svg>

        <div class="city"> Ahmedabad </div>
